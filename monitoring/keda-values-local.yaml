
# Lightweight KEDA configuration for local Minikube.
# Helm chart: kedacore/keda 2.21.0
# Intended for a resource-constrained development cluster.

operator:
  replicaCount: 1

metricsServer:
  enabled: true
  replicaCount: 1

webhooks:
  enabled: true
  replicaCount: 1

certificates:
  autoGenerated: true

resources:
  operator:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 384Mi

  metricServer:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

  webhooks:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
