
# Lightweight monitoring for local Kubernetes experiments.
# Helm chart: kube-prometheus-stack 92.16.1

defaultRules:
  create: false

alertmanager:
  enabled: false

grafana:
  enabled: true
  defaultDashboardsEnabled: false

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 384Mi

  startupProbe:
    httpGet:
      path: /api/health
      port: 3000
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: true

prometheusOperator:
  enabled: true

  admissionWebhooks:
    enabled: false

  tls:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus:
  enabled: true

  prometheusSpec:
    retention: 3h
    # 5s global scrape/evaluation interval ensures kube-state-metrics
    # (replicas_desired, replicas_available) and kubelet/cAdvisor CPU/RAM
    # have 5s resolution matching ServiceMonitor, KEDA pollingInterval, and collect-metrics.py (--step 5).
    scrapeInterval: 5s
    evaluationInterval: 5s

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: false

kubeApiServer:
  enabled: false

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

coreDns:
  enabled: false

kubeDns:
  enabled: false
