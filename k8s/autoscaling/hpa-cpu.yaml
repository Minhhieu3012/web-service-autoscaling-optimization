
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: web-service-hpa-cpu
  namespace: default
  labels:
    app.kubernetes.io/name: web-service-autoscaling
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: web-service-autoscaling-optimization

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-service

  minReplicas: 1
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
