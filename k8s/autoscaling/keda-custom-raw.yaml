
# Baseline KEDA autoscaling using an application-level metric.
#
# IMPORTANT:
# This configuration is a pre-integration baseline.
# Verify the metric, labels, query result, and threshold
# before deploying it to a running workload.
#
# Do not run this ScaledObject concurrently with the
# standalone CPU HPA targeting the same Deployment.

apiVersion: keda.sh/v1alpha1
kind: ScaledObject

metadata:
  name: web-service-keda-custom-raw
  namespace: default
  labels:
    app.kubernetes.io/name: web-service-autoscaling
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: web-service-autoscaling-optimization

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-service

  minReplicaCount: 1
  maxReplicaCount: 3

  pollingInterval: 30
  cooldownPeriod: 300

  triggers:
    - type: prometheus
      name: queue-backlog
      metricType: AverageValue

      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

        # Candidate metric exposed by the FastAPI application.
        # Service labels must be verified in Prometheus.
        #
        # The query must return exactly one numeric result.
        query: 'sum(app_queue_length{namespace="default",service="web-service"})'

        # Initial experimental target:
        # approximately 3 queued requests per replica.
        # This is not an empirically optimized threshold.
        threshold: "3"

        # Missing telemetry should be reported as an error
        # rather than silently treated as zero demand.
        ignoreNullValues: "false"
