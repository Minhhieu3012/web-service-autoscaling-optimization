
apiVersion: v1
kind: Service

metadata:
  name: web-service
  namespace: default
  labels:
    app.kubernetes.io/name: web-service-autoscaling
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: web-service-autoscaling-optimization

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: web-service-autoscaling
    app.kubernetes.io/component: api

  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
