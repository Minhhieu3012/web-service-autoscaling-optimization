
apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-service
  namespace: default
  labels:
    app.kubernetes.io/name: web-service-autoscaling
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: web-service-autoscaling-optimization

spec:
  # replicas is intentionally omitted.
  # HPA or KEDA will manage replica count in later experiments.

  selector:
    matchLabels:
      app.kubernetes.io/name: web-service-autoscaling
      app.kubernetes.io/component: api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-service-autoscaling
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: web-service-autoscaling-optimization

    spec:
      automountServiceAccountToken: false

      containers:
        - name: web-service

          # Local development image.
          # Replace with the confirmed application image
          # before deploying the workload.
          image: web-service-autoscaling:dev
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: MAX_CONCURRENT_WORKERS
              value: "5"

          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      terminationGracePeriodSeconds: 15
